name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Same toolchain as Dockerfile.dev (elixir:1.19.6-otp-28).
  ELIXIR_VERSION: "1.19.6"
  OTP_VERSION: "28.5.0.8"

jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          version-type: strict
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix deps.unlock --check-unused
      - run: mix test

  # Catches Dockerfile and asset breakage before a manual `fly deploy`.
  # Never pushes: there is no registry login and push is false.
  release-image:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whiq_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: whiq:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fly's release_command only checks the exit status, so also check that
      # the packaged script applied every migration file.
      - name: Run the packaged migrate on an empty database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=ecto://postgres:postgres@localhost:5432/whiq_release \
            -e SECRET_KEY_BASE="$(openssl rand -base64 48)" \
            whiq:ci /app/bin/migrate
          expected=$(find priv/repo/migrations -name "[0-9]*_*.exs" | wc -l)
          applied=$(docker exec "$PG_CONTAINER" psql -U postgres -d whiq_release -tAc "select count(*) from schema_migrations")
          echo "applied=$applied expected=$expected"
          test "$applied" -eq "$expected"
